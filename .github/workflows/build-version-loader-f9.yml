name: Build version.dll F9 loader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create F9 loader proxy project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path version_loader_f9 | Out-Null

          Copy-Item pakbypass/VersionProxy.hpp version_loader_f9/VersionProxy.hpp
          Copy-Item pakbypass/Logger.hpp version_loader_f9/Logger.hpp
          Copy-Item pakbypass/version.def version_loader_f9/version.def

          @'
          #include <windows.h>
          #include <string>
          #include "VersionProxy.hpp"

          DWORD WINAPI WaitForF9ThenLoadExporter(LPVOID)
          {
              // Wait until the player is already inside the game/world.
              while (!(GetAsyncKeyState(VK_F9) & 1)) {
                  Sleep(100);
              }

              // Load exporter DLL from the same directory as Client-Win64-Shipping.exe / version.dll.
              HMODULE exporter = LoadLibraryA("export_localization_db.dll");

              if (!exporter) {
                  MessageBoxA(
                      nullptr,
                      "Failed to load export_localization_db.dll.\nMake sure it is in the same folder as version.dll.",
                      "WuwaID Loader",
                      MB_ICONERROR | MB_OK
                  );
              } else {
                  MessageBoxA(
                      nullptr,
                      "export_localization_db.dll loaded successfully.",
                      "WuwaID Loader",
                      MB_OK
                  );
              }

              return 0;
          }

          BOOL APIENTRY DllMain(HMODULE hModule, DWORD ul_reason_for_call, LPVOID)
          {
              switch (ul_reason_for_call)
              {
              case DLL_PROCESS_ATTACH:
                  DisableThreadLibraryCalls(hModule);
                  VersionProxy::LoadRealDll();
                  CreateThread(nullptr, 0, WaitForF9ThenLoadExporter, nullptr, 0, nullptr);
                  break;

              case DLL_PROCESS_DETACH:
                  VersionProxy::Unload();
                  break;
              }

              return TRUE;
          }
          '@ | Set-Content version_loader_f9/dllmain.cpp -Encoding UTF8

          @'
          <?xml version="1.0" encoding="utf-8"?>
          <Project DefaultTargets="Build" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <ItemGroup Label="ProjectConfigurations">
              <ProjectConfiguration Include="Release|x64">
                <Configuration>Release</Configuration>
                <Platform>x64</Platform>
              </ProjectConfiguration>
            </ItemGroup>

            <PropertyGroup Label="Globals">
              <VCProjectVersion>17.0</VCProjectVersion>
              <Keyword>Win32Proj</Keyword>
              <ProjectGuid>{22222222-2222-2222-2222-222222222222}</ProjectGuid>
              <RootNamespace>VersionLoaderF9</RootNamespace>
              <WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>
            </PropertyGroup>

            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.Default.props" />

            <PropertyGroup Condition="'$(Configuration)|$(Platform)'=='Release|x64'" Label="Configuration">
              <ConfigurationType>DynamicLibrary</ConfigurationType>
              <UseDebugLibraries>false</UseDebugLibraries>
              <PlatformToolset>v143</PlatformToolset>
              <WholeProgramOptimization>true</WholeProgramOptimization>
              <CharacterSet>Unicode</CharacterSet>
            </PropertyGroup>

            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.props" />

            <PropertyGroup Condition="'$(Configuration)|$(Platform)'=='Release|x64'">
              <TargetName>version</TargetName>
              <OutDir>$(ProjectDir)x64\Release\</OutDir>
              <IntDir>$(ProjectDir)x64\Release\obj\</IntDir>
            </PropertyGroup>

            <ItemDefinitionGroup Condition="'$(Configuration)|$(Platform)'=='Release|x64'">
              <ClCompile>
                <WarningLevel>Level3</WarningLevel>
                <Optimization>MaxSpeed</Optimization>
                <FunctionLevelLinking>true</FunctionLevelLinking>
                <IntrinsicFunctions>true</IntrinsicFunctions>
                <SDLCheck>false</SDLCheck>
                <PreprocessorDefinitions>NDEBUG;_WINDOWS;_USRDLL;_WINDLL;UNICODE;_UNICODE;%(PreprocessorDefinitions)</PreprocessorDefinitions>
                <LanguageStandard>stdcpp20</LanguageStandard>
                <RuntimeLibrary>MultiThreaded</RuntimeLibrary>
                <AdditionalIncludeDirectories>.;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
              </ClCompile>
              <Link>
                <SubSystem>Windows</SubSystem>
                <EnableCOMDATFolding>true</EnableCOMDATFolding>
                <OptimizeReferences>true</OptimizeReferences>
                <GenerateDebugInformation>true</GenerateDebugInformation>
                <ModuleDefinitionFile>version.def</ModuleDefinitionFile>
              </Link>
            </ItemDefinitionGroup>

            <ItemGroup>
              <ClCompile Include="dllmain.cpp" />
            </ItemGroup>

            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.targets" />
          </Project>
          '@ | Set-Content version_loader_f9/version_loader_f9.vcxproj -Encoding UTF8

      - name: Build version.dll F9 loader
        shell: cmd
        run: |
          msbuild version_loader_f9\version_loader_f9.vcxproj ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /m ^
            /v:normal

      - name: Show outputs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse version_loader_f9 -Include *.dll,*.pdb,*.lib,*.exp | Select-Object FullName

      - name: Upload version.dll F9 loader
        uses: actions/upload-artifact@v4
        with:
          name: version-loader-f9
          path: |
            version_loader_f9/x64/Release/version.dll
            version_loader_f9/x64/Release/version.pdb