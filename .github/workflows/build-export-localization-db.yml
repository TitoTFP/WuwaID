name: Build export_localization_db

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show MSBuild version
        shell: cmd
        run: msbuild -version

      - name: Patch vcxproj include paths and toolset
        shell: pwsh
        run: |
          $proj = "export_localization_db/export_localization_db.vcxproj"

          [xml]$xml = Get-Content $proj
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("msb", "http://schemas.microsoft.com/developer/msbuild/2003")

          # Force MSVC 2022 toolset
          $toolsets = $xml.SelectNodes("//msb:PlatformToolset", $ns)
          foreach ($node in $toolsets) {
            $node.InnerText = "v143"
          }

          # Add include directories to every ClCompile section
          $clCompiles = $xml.SelectNodes("//msb:ItemDefinitionGroup/msb:ClCompile", $ns)
          foreach ($cl in $clCompiles) {
            $inc = $cl.SelectSingleNode("msb:AdditionalIncludeDirectories", $ns)

            if ($null -eq $inc) {
              $inc = $xml.CreateElement("AdditionalIncludeDirectories", "http://schemas.microsoft.com/developer/msbuild/2003")
              [void]$cl.AppendChild($inc)
            }

            $needed = "..;..\SDK;.;%(AdditionalIncludeDirectories)"
            if ([string]::IsNullOrWhiteSpace($inc.InnerText)) {
              $inc.InnerText = $needed
            } elseif ($inc.InnerText -notlike "*..;..\SDK;.*") {
              $inc.InnerText = "..;..\SDK;.;" + $inc.InnerText
            }
          }

          $xml.Save($proj)

          Write-Host "Patched project file:"
          Select-String -Path $proj -Pattern "PlatformToolset|AdditionalIncludeDirectories"

      - name: Build export_localization_db
        shell: cmd
        run: |
          msbuild export_localization_db\export_localization_db.vcxproj ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:WindowsTargetPlatformVersion=10.0 ^
            /m ^
            /v:normal

      - name: Find build outputs
        if: always()
        shell: pwsh
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host "DLL / LIB / EXP / PDB outputs:"
          Get-ChildItem -Recurse -Include *.dll,*.lib,*.exp,*.pdb |
            Select-Object FullName

      - name: Upload DLL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export_localization_db-build-output
          path: |
            **/*.dll
            **/*.lib
            **/*.exp
            **/*.pdb