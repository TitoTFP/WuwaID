name: Build export_localization_db

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show MSBuild version
        shell: cmd
        run: msbuild -version

      - name: Build export_localization_db
        shell: cmd
        run: |
          msbuild export_localization_db\export_localization_db.vcxproj ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:PlatformToolset=v143 ^
            /p:WindowsTargetPlatformVersion=10.0 ^
            /p:AdditionalIncludeDirectories="%CD%;%CD%\SDK;%CD%\export_localization_db;%%(AdditionalIncludeDirectories)" ^
            /m ^
            /v:normal

      - name: Find build outputs
        if: always()
        shell: pwsh
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host "DLL / LIB / EXP / PDB outputs:"
          Get-ChildItem -Recurse -Include *.dll,*.lib,*.exp,*.pdb |
            Select-Object FullName

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: export_localization_db-dll
          path: |
            **/*.dll