name: Build export_localization_db

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show MSBuild version
        shell: cmd
        run: msbuild -version

      - name: Patch toolset
        shell: pwsh
        run: |
          $proj = "src/export_localization_db/export_localization_db.vcxproj"
          [xml]$xml = Get-Content $proj
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("msb", "http://schemas.microsoft.com/developer/msbuild/2003")
          foreach ($node in $xml.SelectNodes("//msb:PlatformToolset", $ns)) {
            $node.InnerText = "v143"
          }
          $xml.Save($proj)

      - name: Build export_localization_db
        shell: cmd
        run: |
          msbuild src\export_localization_db\export_localization_db.vcxproj ^
            /p:SolutionDir=%CD%\ ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:WindowsTargetPlatformVersion=10.0 ^
            /m ^
            /v:normal

      - name: Find build outputs
        if: always()
        shell: pwsh
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host "DLL / LIB / EXP / PDB outputs:"
          Get-ChildItem -Recurse -Include *.dll,*.lib,*.exp,*.pdb |
            Select-Object FullName

      - name: Upload DLL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export_localization_db-build-output
          path: |
            **/*.dll
            **/*.lib
            **/*.exp
            **/*.pdb
