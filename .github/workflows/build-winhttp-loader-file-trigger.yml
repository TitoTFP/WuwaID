name: Build winhttp.dll file trigger loader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create file trigger loader proxy project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path winhttp_loader_file | Out-Null

          Copy-Item pakbypass/WinhttpProxy.hpp winhttp_loader_file/WinhttpProxy.hpp
          Copy-Item pakbypass/Logger.hpp winhttp_loader_file/Logger.hpp
          Copy-Item pakbypass/winhttp.def winhttp_loader_file/winhttp.def

          @'
          #include <windows.h>
          #include <string>
          #include "WinhttpProxy.hpp"

          static void WriteLog(const char* msg)
          {
              HANDLE h = CreateFileA(
                  "wuwaid_loader_log.txt",
                  FILE_APPEND_DATA,
                  FILE_SHARE_READ,
                  nullptr,
                  OPEN_ALWAYS,
                  FILE_ATTRIBUTE_NORMAL,
                  nullptr
              );

              if (h != INVALID_HANDLE_VALUE) {
                  DWORD written = 0;
                  WriteFile(h, msg, (DWORD)lstrlenA(msg), &written, nullptr);
                  WriteFile(h, "\r\n", 2, &written, nullptr);
                  CloseHandle(h);
              }
          }

          static bool FileExists(const char* path)
          {
              DWORD attr = GetFileAttributesA(path);
              return attr != INVALID_FILE_ATTRIBUTES && !(attr & FILE_ATTRIBUTE_DIRECTORY);
          }

          DWORD WINAPI WaitForTriggerThenLoadExporter(LPVOID)
          {
              WriteLog("winhttp.dll loaded. Waiting for wuwaid_trigger.txt...");

              while (!FileExists("wuwaid_trigger.txt")) {
                  Sleep(1000);
              }

              WriteLog("Trigger file detected. Loading export_localization_db.dll...");

              HMODULE exporter = LoadLibraryA("export_localization_db.dll");

              if (!exporter) {
                  DWORD err = GetLastError();
                  char buf[256];
                  wsprintfA(buf, "Failed to load export_localization_db.dll. GetLastError=%lu", err);
                  WriteLog(buf);

                  MessageBoxA(
                      nullptr,
                      buf,
                      "WuwaID Loader",
                      MB_ICONERROR | MB_OK
                  );
              } else {
                  WriteLog("export_localization_db.dll loaded successfully.");

                  MessageBoxA(
                      nullptr,
                      "export_localization_db.dll loaded successfully.",
                      "WuwaID Loader",
                      MB_OK
                  );
              }

              return 0;
          }

          BOOL APIENTRY DllMain(HMODULE hModule, DWORD ul_reason_for_call, LPVOID)
          {
              switch (ul_reason_for_call)
              {
              case DLL_PROCESS_ATTACH:
                  DisableThreadLibraryCalls(hModule);
                  WinhttpProxy::LoadRealDll();
                  CreateThread(nullptr, 0, WaitForTriggerThenLoadExporter, nullptr, 0, nullptr);
                  break;

              case DLL_PROCESS_DETACH:
                  WinhttpProxy::Unload();
                  break;
              }

              return TRUE;
          }
          '@ | Set-Content winhttp_loader_file/dllmain.cpp -Encoding UTF8

          @'
          <?xml version="1.0" encoding="utf-8"?>
          <Project DefaultTargets="Build" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <ItemGroup Label="ProjectConfigurations">
              <ProjectConfiguration Include="Release|x64">
                <Configuration>Release</Configuration>
                <Platform>x64</Platform>
              </ProjectConfiguration>
            </ItemGroup>

            <PropertyGroup Label="Globals">
              <VCProjectVersion>17.0</VCProjectVersion>
              <Keyword>Win32Proj</Keyword>
              <ProjectGuid>{33333333-3333-3333-3333-333333333333}</ProjectGuid>
              <RootNamespace>WinhttpLoaderFile</RootNamespace>
              <WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>
            </PropertyGroup>

            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.Default.props" />

            <PropertyGroup Condition="'$(Configuration)|$(Platform)'=='Release|x64'" Label="Configuration">
              <ConfigurationType>DynamicLibrary</ConfigurationType>
              <UseDebugLibraries>false</UseDebugLibraries>
              <PlatformToolset>v143</PlatformToolset>
              <WholeProgramOptimization>true</WholeProgramOptimization>
              <CharacterSet>Unicode</CharacterSet>
            </PropertyGroup>

            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.props" />

            <PropertyGroup Condition="'$(Configuration)|$(Platform)'=='Release|x64'">
              <TargetName>winhttp</TargetName>
              <OutDir>$(ProjectDir)x64\Release\</OutDir>
              <IntDir>$(ProjectDir)x64\Release\obj\</IntDir>
            </PropertyGroup>

            <ItemDefinitionGroup Condition="'$(Configuration)|$(Platform)'=='Release|x64'">
              <ClCompile>
                <WarningLevel>Level3</WarningLevel>
                <Optimization>MaxSpeed</Optimization>
                <FunctionLevelLinking>true</FunctionLevelLinking>
                <IntrinsicFunctions>true</IntrinsicFunctions>
                <SDLCheck>false</SDLCheck>
                <PreprocessorDefinitions>NDEBUG;_WINDOWS;_USRDLL;_WINDLL;UNICODE;_UNICODE;%(PreprocessorDefinitions)</PreprocessorDefinitions>
                <LanguageStandard>stdcpp20</LanguageStandard>
                <RuntimeLibrary>MultiThreaded</RuntimeLibrary>
                <AdditionalIncludeDirectories>.;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
              </ClCompile>
              <Link>
                <SubSystem>Windows</SubSystem>
                <EnableCOMDATFolding>true</EnableCOMDATFolding>
                <OptimizeReferences>true</OptimizeReferences>
                <GenerateDebugInformation>true</GenerateDebugInformation>
                <ModuleDefinitionFile>winhttp.def</ModuleDefinitionFile>
              </Link>
            </ItemDefinitionGroup>

            <ItemGroup>
              <ClCompile Include="dllmain.cpp" />
            </ItemGroup>

            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.targets" />
          </Project>
          '@ | Set-Content winhttp_loader_file/winhttp_loader_file.vcxproj -Encoding UTF8

      - name: Build winhttp.dll file trigger loader
        shell: cmd
        run: |
          msbuild winhttp_loader_file\winhttp_loader_file.vcxproj ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /m ^
            /v:normal

      - name: Upload winhttp.dll file trigger loader
        uses: actions/upload-artifact@v4
        with:
          name: winhttp-loader-file-trigger
          path: |
            winhttp_loader_file/x64/Release/winhttp.dll
            winhttp_loader_file/x64/Release/winhttp.pdb
